name: Bot YouTube - Shorts (2 al día, horarios optimizados)

on:
  schedule:
    - cron: '0 18,01 * * *'   # 12:00 PM y 7:00 PM CDMX
  workflow_dispatch:

permissions:
  contents: write

# 🔴 MISMO group que youtube.yml — serializa ambos workflows
concurrency:
  group: sombras-bot
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    # 🔴 60 min porque el bot duerme hasta 30 min al inicio (RETRASO_MAX_MINUTOS)
    timeout-minutes: 60

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache de pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v2
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependencias del sistema (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar dependencias de Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar bot de Shorts
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_USER_TOKEN: ${{ secrets.YOUTUBE_USER_TOKEN }}
          MAKE_WEBHOOK_URL_REELS: ${{ secrets.MAKE_WEBHOOK_URL_REELS }}
          PYTHONUNBUFFERED: '1'
        run: python bot_shorts.py

      - name: Commit y push del estado
        if: always()   # 🔴 imprescindible: guarda aunque el bot falle a medias
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 🔴 estado_shorts.json + analytics_elite.json AÑADIDOS
          git add estado_shorts.json \
                  titulos_shorts_publicados.json \
                  temas_usados.json \
                  analytics_elite.json || true

          if git diff --cached --quiet; then
            echo "✅ No hay cambios en archivos de estado."
            exit 0
          fi

          git commit -m "Actualizar estado shorts [skip ci]"

          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "✅ Push exitoso (intento $i)"
              exit 0
            fi
            echo "⚠️ Intento $i/5 falló, reintentando en 10s..."
            sleep 10
          done
          echo "❌ Push falló tras 5 intentos"
          exit 1
