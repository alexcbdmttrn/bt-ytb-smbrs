name: Bot YouTube - Shorts (2 al día)

on:
  schedule:
    - cron: '0 18,01 * * *'   # 13:00 y 20:00 CDMX (UTC-5)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sombras-bot
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache de pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v2
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar dependencias de Python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Mostrar estado actual antes de ejecutar
        run: |
          echo "=== estado_shorts.json ==="
          cat estado_shorts.json 2>/dev/null || echo "(archivo no existe aún)"
          echo ""
          echo "=== temas_usados.json (últimos 5) ==="
          python3 -c "
          import json
          try:
              d = json.load(open('temas_usados.json'))
              print(d['temas'][-5:])
          except:
              print('(archivo no existe aún)')
          "

      - name: Ejecutar bot de Shorts
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_USER_TOKEN: ${{ secrets.YOUTUBE_USER_TOKEN }}
          PYTHONUNBUFFERED: '1'
        run: python bot_shorts.py

      - name: Commit y push del estado
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add estado_shorts.json \
                  titulos_shorts_publicados.json \
                  temas_usados.json \
                  analytics_elite.json || true

          if git diff --cached --quiet; then
            echo "✅ Sin cambios en archivos de estado."
            exit 0
          fi

          git commit -m "Actualizar estado shorts [skip ci]"

          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "✅ Push exitoso (intento $i)"
              exit 0
            fi
            echo "⚠️ Intento $i/5 falló, reintentando en 10s..."
            sleep 10
          done
          echo "❌ Push falló tras 5 intentos"
          exit 1
