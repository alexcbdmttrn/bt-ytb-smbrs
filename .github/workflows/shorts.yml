name: Bot YouTube - Shorts (3 al día)

on:
  schedule:
    - cron: '0 14 * * *'   # 8:00 AM CDMX (14:00 UTC)
    - cron: '0 20 * * *'   # 2:00 PM CDMX (20:00 UTC)
    - cron: '0 2 * * *'    # 8:00 PM CDMX (02:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install Pillow>=10.0.0
          pip install moviepy==1.0.3
          pip install requests google-auth google-api-python-client google-auth-oauthlib
          pip install edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Ejecutar bot de Shorts
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          YOUTUBE_USER_TOKEN: ${{ secrets.YOUTUBE_USER_TOKEN }}
        run: python bot_shorts.py

      - name: Commit y push del estado
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add estado_shorts.json
          if git diff-index --quiet HEAD; then
            echo "✅ No hay cambios en estado_shorts.json"
          else
            git commit -m "Actualizar estado shorts [skip ci]"
            git pull origin main --rebase
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
