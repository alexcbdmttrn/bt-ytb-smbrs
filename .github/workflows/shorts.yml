name: Bot YouTube - Shorts (Publicación humana)

on:
  schedule:
    # Ejecución cada 3 horas, pero el bot decide si publicar
    - cron: '0 */3 * * *'   # Cada 3 horas (00:00, 03:00, 06:00...)
    # También algunas ejecuciones en horarios menos predecibles
    - cron: '15 1,7,13,19 * * *'   # 1:15, 7:15, 13:15, 19:15
    - cron: '45 4,10,16,22 * * *'   # 4:45, 10:45, 16:45, 22:45
  workflow_dispatch:  # Para pruebas manuales

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del sistema (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar dependencias de Python
        run: |
          pip install --upgrade pip
          pip install 'Pillow<10.0.0'
          pip install moviepy==1.0.3
          pip install requests google-auth google-api-python-client google-auth-oauthlib
          pip install edge-tts
          pip install gTTS
          pip install json5
          pip install pytz
          pip install urllib3

      - name: Verificar API Key de Pexels
        run: |
          if [ -z "${{ secrets.PEXELS_API_KEY }}" ]; then
            echo "⚠️ PEXELS_API_KEY no está configurada en Secrets. Se usarán placeholders."
          else
            echo "✅ PEXELS_API_KEY está configurada."
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: ${{ secrets.PEXELS_API_KEY }}" "https://api.pexels.com/v1/search?query=test&per_page=1")
            if [ "$RESPONSE" -eq 200 ]; then
              echo "✅ API Key de Pexels válida."
            else
              echo "⚠️ API Key de Pexels devolvió código $RESPONSE."
            fi
          fi

      - name: Ejecutar bot de Shorts (modo humano)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_USER_TOKEN: ${{ secrets.YOUTUBE_USER_TOKEN }}
        run: python bot_shorts.py

      - name: Commit y push del estado
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add estado_shorts.json titulos_shorts_publicados.json temas_usados.json estado_musica.json || true

          if git diff-index --quiet HEAD; then
            echo "✅ No hay cambios en el estado"
            exit 0
          fi

          git commit -m "Actualizar estado shorts [skip ci]"

          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "✅ Push exitoso"
              break
            fi
            echo "⚠️ Intento $i/5 falló, reintentando en 10s..."
            sleep 10
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
