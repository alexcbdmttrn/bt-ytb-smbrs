name: Bot YouTube - Publicación

on:
  schedule:
    - cron: '0 21 * * *'   # 3:00 PM CDMX
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Limpiar caché de pip
        run: |
          pip cache purge
          echo "✅ Caché de pip limpiada"

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install Pillow>=10.0.0
          pip install moviepy==1.0.3
          pip install requests google-auth google-api-python-client google-auth-oauthlib
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verificar instalación
        run: |
          python -c "import moviepy; print('moviepy OK')"
          python -c "from moviepy.editor import ImageClip; print('ImageClip OK')"
          python -c "import PIL; print('Pillow OK')"

      - name: Ejecutar bot de YouTube
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AZURE_TTS_KEY: ${{ secrets.AZURE_TTS_KEY }}
          AZURE_TTS_REGION: ${{ secrets.AZURE_TTS_REGION }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          YOUTUBE_USER_TOKEN: ${{ secrets.YOUTUBE_USER_TOKEN }}
        run: python bot_youtube.py
