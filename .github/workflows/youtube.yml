name: Bot YouTube - Publicación

on:
  schedule:
    - cron: '0 21 * * *'   # 3:00 PM CDMX - intento principal
    - cron: '0 1 * * *'    # 7:00 PM CDMX - respaldo (se auto-cancela si ya se publicó)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Limpiar caché de pip
        run: |
          pip cache purge
          echo "✅ Caché de pip limpiada"

      - name: Instalar dependencias del sistema (ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Instalar dependencias de Python
        run: |
          pip install --upgrade pip
          pip install "Pillow<10.0.0"
          pip install moviepy==1.0.3
          pip install requests google-auth google-api-python-client google-auth-oauthlib
          pip install edge-tts
          pip install json5
          pip install urllib3

      - name: Verificar instalación
        run: |
          python -c "import moviepy; print('moviepy OK')"
          python -c "from moviepy.editor import ImageClip; print('ImageClip OK')"
          python -c "import PIL; print('Pillow OK')"
          python -c "import edge_tts; print('edge-tts OK')"
          python -c "import json5; print('json5 OK')"

      - name: Ejecutar bot de YouTube (videos largos)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_USER_TOKEN: ${{ secrets.YOUTUBE_USER_TOKEN }}
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python bot_youtube.py

      - name: Commit y push del estado
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Añadir todos los archivos de estado
          git add estado_musica.json titulos_largos_publicados.json temas_shorts.json || true

          if git diff-index --quiet HEAD; then
            echo "✅ No hay cambios en los archivos de estado."
            exit 0
          fi

          git commit -m "Actualizar estado [skip ci]"

          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "✅ Push exitoso"
              break
            fi
            echo "⚠️ Intento $i/5 falló, reintentando en 10s..."
            sleep 10
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
