name: Bot YouTube - Publicación

on:
  schedule:
    - cron: '0 21 * * *'   # 3:00 PM CDMX (21:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Limpiar caché de pip
        run: |
          pip cache purge
          echo "✅ Caché de pip limpiada"

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install "Pillow<10.0.0"         # Fijado para compatibilidad con moviepy 1.0.3
          pip install moviepy==1.0.3
          pip install requests google-auth google-api-python-client google-auth-oauthlib
          pip install edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core   # Fuentes para miniatura

      - name: Verificar instalación
        run: |
          python -c "import moviepy; print('moviepy OK')"
          python -c "from moviepy.editor import ImageClip; print('ImageClip OK')"
          python -c "import PIL; print('Pillow OK')"
          python -c "import edge_tts; print('edge-tts OK')"

      - name: Ejecutar bot de YouTube
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          YOUTUBE_USER_TOKEN: ${{ secrets.YOUTUBE_USER_TOKEN }}
        run: python bot_youtube.py

      - name: Commit y push del estado de música
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add estado_musica.json
          if git diff-index --quiet HEAD; then
            echo "✅ No hay cambios en estado_musica.json"
          else
            git commit -m "Actualizar estado música [skip ci]"
            git pull origin main --rebase
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
